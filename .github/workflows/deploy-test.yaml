name: Test Deploy

on:
    push:
        branches:
            - test

permissions:
    id-token: write
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v3

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "22"

            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.10"

            - name: Configure AWS Credentials for Test via OIDC
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.ORG_TEST_ROLE_ARN }}
                  aws-region: ${{ secrets.ORG_AWS_ENV_REGION }}

            - name: Install Dependencies
              run: |
                  npm install -g aws-cdk
                  pip install -r requirements.txt

            - name: Run PyTest
              run: |
                  pytest
                  ret=$?
                  if [ $ret -eq 5 ]; then
                    echo "No tests found. Treating as success."
                    exit 0
                  else
                    exit $ret
                  fi

            - name: Deploy CDK Stack to Test
              run: >
                cdk deploy "JudithLoggingDev/*"
                --require-approval never
                --context env=test
                --context accountId=${{ secrets.ORG_TEST_ACCOUNT_ID }}
                --context region=eu-west-2
